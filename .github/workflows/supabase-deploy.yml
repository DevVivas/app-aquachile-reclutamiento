name: Deploy backend (Supabase)

# Aplica migraciones y despliega Edge Functions cuando cambia supabase/ en main.
# Requiere el secreto SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens)
# y SUPABASE_DB_PASSWORD; la variable SUPABASE_PROJECT_REF identifica el proyecto.
on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'qcqnnedlbyfybzdulfwv' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if not configured
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF no configurados: se omite el despliegue." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
        with: { version: latest }
      - name: Link project
        if: steps.check.outputs.skip != 'true'
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Push migrations
        if: steps.check.outputs.skip != 'true' && env.SUPABASE_DB_PASSWORD != ''
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy Edge Functions
        if: steps.check.outputs.skip != 'true'
        run: |
          supabase functions deploy submit-application --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy register-staff --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy analyze-application --no-verify-jwt --project-ref "$PROJECT_REF"
